# Site Information
site:
  name: "Sahyadri Alumni Network"
  description: "The official alumni portal for Sahyadri College of Engineering & Management to bridge the gap between current students, faculty, and alumni."
  url: "https://sahyadri-alumni-network.vercel.app"
  logo: "/logo.png"
  favicon: "/favicon.ico"
  hero_image: "/hero-bg.jpg"

# Organization Details
organization:
  name: "Sahyadri College of Engineering & Management"
  website: "https://www.sahyadri.edu.in"
  email: "contact@sahyadri.edu.in"
  address: "Sahyadri Campus, Adyar, Mangaluru - 575007, Karnataka, India"

